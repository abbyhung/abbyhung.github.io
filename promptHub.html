<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Hub - 專案題示詞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        .sortable-ghost { opacity: 0.3; background: #eef2ff; border: 2px dashed #6366f1; }
        .drag-handle { cursor: grab; }
        
        /* 同步動畫 */
        @keyframes sync-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-sync { animation: sync-spin 2s linear infinite; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- 側邊欄 -->
    <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex flex-col h-1/3 md:h-full">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="table-2" class="w-6 h-6 text-indigo-600"></i>
                Prompt Hub
            </h1>
            <div class="flex items-center gap-1">
                <div id="autoSyncIndicator" class="hidden" title="自動同步中">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-emerald-500 animate-sync"></i>
                </div>
                <button onclick="openModal('settingsModal')" class="p-2 hover:bg-slate-100 rounded-lg text-slate-400">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
        
        <div class="p-4">
            <button onclick="openModal('projectModal')" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-indigo-700 shadow-sm transition-all">
                <i data-lucide="plus" class="w-4 h-4"></i> 新增專案
            </button>
        </div>

        <nav id="projectList" class="flex-1 overflow-y-auto custom-scrollbar px-3 pb-4 space-y-1">
            <!-- 專案清單 -->
        </nav>

        <div class="p-4 border-t border-slate-100 space-y-2">
            <div class="flex items-center justify-between px-2 mb-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">同步狀態</span>
                <span id="lastSyncTime" class="text-[10px] text-slate-400 font-mono">尚未同步</span>
            </div>
            <button id="syncBtn" onclick="manualSync()" class="w-full py-2 px-4 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg flex items-center justify-center gap-2 font-medium transition-colors">
                <i data-lucide="cloud-upload" class="w-4 h-4"></i>
                立即同步
            </button>
            <button onclick="exportJSON()" class="w-full py-2 px-4 text-slate-500 hover:bg-slate-100 rounded-lg flex items-center gap-2 text-sm transition-colors">
                <i data-lucide="download" class="w-4 h-4"></i> 本地備份 (JSON)
            </button>
        </div>
    </aside>

    <!-- 主要內容 -->
    <main class="flex-1 flex flex-col h-2/3 md:h-full relative">
        <header class="bg-white border-b border-slate-200 p-5 flex items-center justify-between shadow-sm z-10">
            <div class="flex flex-col">
                <h2 id="currentProjectTitle" class="text-xl font-bold text-slate-800">載入中...</h2>
                <p id="promptCount" class="text-sm text-slate-400">準備就緒</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('promptModal')" class="bg-slate-800 text-white px-5 py-2.5 rounded-xl font-medium flex items-center gap-2 hover:bg-slate-900 transition-all">
                    <i data-lucide="file-plus" class="w-5 h-5"></i> 新增提示詞
                </button>
                <button onclick="deleteCurrentProject()" class="p-2.5 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <div id="promptContainer" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 custom-scrollbar">
            <!-- 提示詞卡片 -->
        </div>

        <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-300 pointer-events-none">
            <i data-lucide="layers" class="w-16 h-16 mb-4 opacity-20"></i>
            <p class="text-lg">目前此專案尚無資料</p>
        </div>
    </main>

    <!-- 彈窗：設定 -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeModal('settingsModal')"></div>
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md relative z-10 p-6">
            <h3 class="text-xl font-bold text-slate-800 mb-2 flex items-center gap-2">
                <i data-lucide="settings" class="w-5 h-5"></i> 系統設定
            </h3>
            <p class="text-sm text-slate-400 mb-6">設定完成後，所有變更將自動同步至雲端。</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider">Web App URL</label>
                    <input type="text" id="sheetsUrlInput" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-xs" placeholder="https://script.google.com/macros/s/.../exec">
                </div>
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                    <div class="text-sm">
                        <p class="font-bold text-slate-700">自動同步模式</p>
                        <p class="text-xs text-slate-400">變更後 2 秒自動觸發</p>
                    </div>
                    <div class="w-10 h-5 bg-emerald-500 rounded-full relative">
                        <div class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></div>
                    </div>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeModal('settingsModal')" class="flex-1 py-3 text-slate-500 font-medium">取消</button>
                <button onclick="saveSettings()" class="flex-1 py-3 bg-indigo-600 text-white font-medium rounded-xl shadow-md">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 彈窗：提示詞 -->
    <div id="promptModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeModal('promptModal')"></div>
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl relative z-10 p-6 flex flex-col max-h-[90vh]">
            <h3 id="promptModalTitle" class="text-xl font-bold text-slate-800 mb-6">新增提示詞</h3>
            <div class="space-y-5 overflow-y-auto pr-2 custom-scrollbar">
                <input type="hidden" id="editPromptId">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">提示詞標題</label>
                    <input type="text" id="promptTitleInput" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="例如：萬能寫作助手">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">指令內容 (Prompt)</label>
                    <textarea id="promptContentInput" rows="8" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-sm leading-relaxed" placeholder="輸入您的 AI 提示詞..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">補充備註</label>
                    <textarea id="promptNoteInput" rows="2" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-slate-50" placeholder="記錄此內容的使用建議..."></textarea>
                </div>
            </div>
            <div class="mt-8 flex gap-3 shrink-0">
                <button onclick="closeModal('promptModal')" class="flex-1 py-3 text-slate-500 font-medium">取消</button>
                <button onclick="savePrompt()" class="flex-1 py-3 bg-indigo-600 text-white font-medium rounded-xl shadow-lg">儲存訊息</button>
            </div>
        </div>
    </div>

    <!-- 彈窗：專案 -->
    <div id="projectModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeModal('projectModal')"></div>
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm relative z-10 p-6 text-center">
            <h3 class="text-xl font-bold text-slate-800 mb-4">建立新專案</h3>
            <input type="text" id="projectNameInput" class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 mb-6" placeholder="專案名稱...">
            <div class="flex gap-3">
                <button onclick="closeModal('projectModal')" class="flex-1 py-2 text-slate-400 font-medium">取消</button>
                <button onclick="saveProject()" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg font-medium shadow-md">建立</button>
            </div>
        </div>
    </div>

    <!-- Toast 訊息 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-[100] flex items-center gap-3">
        <span id="toastMsg">訊息已更新</span>
    </div>

    <script>
        // 初始化
        let db = {
            settings: { 
                sheetsUrl: 'https://script.google.com/macros/s/AKfycbxV-xuWxPIPhpPHiMSDA-P7pSrxmY8afcZKpQi33qnxuMNyfa3CUac5AsLOBEJvWb6f/exec' 
            },
            projects: [{ id: 'p1', name: '預設專案', prompts: [] }],
            currentProjectId: 'p1'
        };

        let syncTimer = null; // 防抖定時器

        window.onload = () => {
            const saved = localStorage.getItem('prompt_hub_sync_v2');
            if (saved) {
                try { 
                    const parsed = JSON.parse(saved);
                    if (parsed.settings) db = parsed;
                } catch(e) { console.error(e); }
            }
            document.getElementById('sheetsUrlInput').value = db.settings.sheetsUrl || '';
            renderUI();
            initSortable();
            lucide.createIcons();
        };

        // 核心：儲存並觸發自動同步
        function saveDB() {
            localStorage.setItem('prompt_hub_sync_v2', JSON.stringify(db));
            triggerAutoSync();
        }

        // 防抖同步邏輯
        function triggerAutoSync() {
            if (!db.settings.sheetsUrl) return;

            // 顯示準備同步狀態
            document.getElementById('autoSyncIndicator').classList.remove('hidden');
            
            // 清除之前的定時器
            if (syncTimer) clearTimeout(syncTimer);

            // 設定 2 秒後執行
            syncTimer = setTimeout(async () => {
                await performSync();
                document.getElementById('autoSyncIndicator').classList.add('hidden');
            }, 2000);
        }

        async function manualSync() {
            document.getElementById('autoSyncIndicator').classList.remove('hidden');
            await performSync();
            document.getElementById('autoSyncIndicator').classList.add('hidden');
            showToast('手動同步完成');
        }

        async function performSync() {
            const url = db.settings.sheetsUrl;
            if (!url) return;

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors', 
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(db)
                });
                
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                document.getElementById('lastSyncTime').innerText = `已同步 ${timeStr}`;
            } catch (err) {
                console.error("Sync Failed", err);
                document.getElementById('lastSyncTime').innerText = `同步失敗`;
            }
        }

        function renderUI() {
            const list = document.getElementById('projectList');
            if (!list) return;
            list.innerHTML = '';
            
            db.projects.forEach(p => {
                const active = p.id === db.currentProjectId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between px-4 py-3 rounded-xl cursor-pointer transition-all ${active ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-white hover:text-slate-800'}`;
                div.onclick = () => { db.currentProjectId = p.id; renderUI(); };
                div.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden font-medium">
                        <i data-lucide="folder" class="w-4 h-4 opacity-40"></i>
                        <span class="truncate">${p.name}</span>
                    </div>
                    <span class="text-[10px] bg-black/10 px-2 py-0.5 rounded-full">${p.prompts.length}</span>
                `;
                list.appendChild(div);
            });

            const project = db.projects.find(p => p.id === db.currentProjectId);
            if (!project) return;
            
            document.getElementById('currentProjectTitle').innerText = project.name;
            document.getElementById('promptCount').innerText = `目前有 ${project.prompts.length} 組內容`;
            
            const container = document.getElementById('promptContainer');
            const empty = document.getElementById('emptyState');
            container.innerHTML = '';
            
            if (project.prompts.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                project.prompts.forEach(p => {
                    const card = document.createElement('div');
                    card.className = "bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all";
                    card.innerHTML = `
                        <div class="p-4 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <div class="drag-handle text-slate-300 hover:text-slate-500 transition-colors"><i data-lucide="grip-vertical" class="w-5 h-5"></i></div>
                                <h4 class="font-bold text-slate-800 truncate">${p.title}</h4>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="copyPrompt('${p.id}')" class="p-2 text-indigo-600 hover:bg-white rounded-lg transition-colors"><i data-lucide="copy" class="w-4 h-4"></i></button>
                                <button onclick="editPrompt('${p.id}')" class="p-2 text-slate-400 hover:bg-white rounded-lg transition-colors"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="deletePrompt('${p.id}')" class="p-2 text-slate-300 hover:text-red-500 hover:bg-white rounded-lg transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="p-5">
                            <pre class="text-sm text-slate-600 whitespace-pre-wrap font-mono bg-slate-50 p-4 rounded-xl border border-slate-100 mb-3 select-all">${p.content}</pre>
                            ${p.note ? `<div class="flex gap-2 text-slate-400 p-2 text-xs italic bg-slate-50/50 rounded-lg"><i data-lucide="info" class="w-3.5 h-3.5 shrink-0"></i>${p.note}</div>` : ''}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        // --- 功能與操作 ---
        function initSortable() {
            Sortable.create(document.getElementById('promptContainer'), {
                animation: 250, handle: '.drag-handle', ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const project = db.projects.find(p => p.id === db.currentProjectId);
                    const [moved] = project.prompts.splice(evt.oldIndex, 1);
                    project.prompts.splice(evt.newIndex, 0, moved);
                    saveDB();
                }
            });

            Sortable.create(document.getElementById('projectList'), {
                animation: 250, ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const [moved] = db.projects.splice(evt.oldIndex, 1);
                    db.projects.splice(evt.newIndex, 0, moved);
                    saveDB();
                }
            });
        }

        function savePrompt() {
            const title = document.getElementById('promptTitleInput').value.trim();
            const content = document.getElementById('promptContentInput').value.trim();
            const note = document.getElementById('promptNoteInput').value.trim();
            const editId = document.getElementById('editPromptId').value;

            if (!title || !content) return showToast('標題與內容為必填', true);

            const project = db.projects.find(p => p.id === db.currentProjectId);
            if (editId) {
                const idx = project.prompts.findIndex(p => p.id === editId);
                project.prompts[idx] = { ...project.prompts[idx], title, content, note };
            } else {
                project.prompts.push({ id: 'pr' + Date.now(), title, content, note });
            }

            saveDB();
            renderUI();
            closeModal('promptModal');
            showToast('訊息已自動排程同步');
        }

        function saveProject() {
            const name = document.getElementById('projectNameInput').value.trim();
            if (!name) return;
            const id = 'p' + Date.now();
            db.projects.push({ id, name, prompts: [] });
            db.currentProjectId = id;
            saveDB();
            renderUI();
            closeModal('projectModal');
        }

        function deletePrompt(id) {
            if (confirm('確定要移除此提示詞嗎？')) {
                const project = db.projects.find(p => p.id === db.currentProjectId);
                project.prompts = project.prompts.filter(p => p.id !== id);
                saveDB();
                renderUI();
            }
        }

        function deleteCurrentProject() {
            if (db.projects.length <= 1) return showToast('需保留至少一個專案', true);
            if (confirm('確定要刪除整個專案嗎？')) {
                db.projects = db.projects.filter(p => p.id !== db.currentProjectId);
                db.currentProjectId = db.projects[0].id;
                saveDB();
                renderUI();
            }
        }

        function saveSettings() {
            db.settings.sheetsUrl = document.getElementById('sheetsUrlInput').value.trim();
            saveDB();
            closeModal('settingsModal');
            showToast('連線設定已儲存');
        }

        function copyPrompt(id) {
            const project = db.projects.find(p => p.id === db.currentProjectId);
            const p = project.prompts.find(item => item.id === id);
            const el = document.createElement('textarea');
            el.value = p.content;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('內容已複製');
        }

        function editPrompt(id) {
            const project = db.projects.find(p => p.id === db.currentProjectId);
            const p = project.prompts.find(item => item.id === id);
            document.getElementById('promptModalTitle').innerText = '編輯提示詞';
            document.getElementById('editPromptId').value = p.id;
            document.getElementById('promptTitleInput').value = p.title;
            document.getElementById('promptContentInput').value = p.content;
            document.getElementById('promptNoteInput').value = p.note || '';
            openModal('promptModal');
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `prompt_hub_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        // UI 控制
        window.openModal = (id) => {
            const m = document.getElementById(id);
            if (id === 'promptModal' && !document.getElementById('editPromptId').value) {
                ['editPromptId', 'promptTitleInput', 'promptContentInput', 'promptNoteInput'].forEach(i => document.getElementById(i).value = '');
            }
            m.classList.remove('hidden');
        };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        function showToast(msg, isErr = false) {
            const t = document.getElementById('toast');
            const tm = document.getElementById('toastMsg');
            tm.innerText = msg;
            t.style.backgroundColor = isErr ? '#ef4444' : '#0f172a';
            t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
